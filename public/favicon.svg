<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circular arrow (time rewind/history) -->
  <path d="M 50 10
           A 40 40 0 1 1 15 65"
        fill="none"
        stroke="url(#arrowGradient)"
        stroke-width="8"
        stroke-linecap="round"/>

  <!-- Arrow head -->
  <polygon points="10,50 25,65 20,45" fill="url(#arrowGradient)"/>

  <!-- Clock face background -->
  <circle cx="50" cy="50" r="32" fill="white"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Clock hands -->
  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="65" y2="45" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="3" fill="#374151"/>
</svg>
